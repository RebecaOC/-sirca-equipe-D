services:
  banco:
    image: postgres:16-alpine
    container_name: semear-db
    environment:
      POSTGRES_DB: semear
      POSTGRES_USER: semear
      POSTGRES_PASSWORD: semear
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - dados_semear:/var/lib/postgresql/data

volumes:
  dados_semear:
